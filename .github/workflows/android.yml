name: Build HanZihan UABE APK (32-bit ARM)

on:
  workflow_dispatch:
  push:
    branches: [ '**' ]

permissions:
  contents: read

env:
  GRADLE_VERSION: '8.13'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python source and bridge tests
        env:
          PYTHONPATH: app/src/main/python
        run: |
          python -m compileall -q app/src/main/python
          python -m unittest discover -s tests -v

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --warning-mode all assembleDebug 2>&1 | tee build.log

      - name: Verify APK is 32-bit ARM only
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -Z1 "$APK" > apk-entries.txt
          grep -q '^lib/armeabi-v7a/' apk-entries.txt
          if grep -Eq '^lib/(arm64-v8a|x86|x86_64)/' apk-entries.txt; then
            echo 'Unexpected non-32-bit native ABI found in APK.' >&2
            exit 1
          fi
          echo 'APK contains armeabi-v7a native libraries.'
          sha256sum "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HanZihan-UABE-32bit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HanZihan-UABE-32bit-build-diagnostics
          path: |
            build.log
            apk-entries.txt
          if-no-files-found: ignore
          retention-days: 7
