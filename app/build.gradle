plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.hanzihan.uabe'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hanzihan.uabe'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk {
            abiFilters 'armeabi-v7a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = '3.11'
    }
}
